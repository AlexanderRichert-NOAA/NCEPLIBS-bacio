name: Validate PR

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested, edited]
  pull_request_review:
    types: [submitted]

jobs:
  Checks:
    permissions:
      pull-requests: read
    uses: AlexanderRichert-NOAA/ci-validate-pr/.github/workflows/validate-pr.yaml@1a00245740a1156daf9913062de4b2c9b57f41fe
    with:
      validate-genai-disclosure: true
      approvals-for-external-contributors: 1
