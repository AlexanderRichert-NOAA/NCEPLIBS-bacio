name: Validate PR

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested, edited]
  pull_request_review:
    types: [submitted]

jobs:
  Checks:
    permissions:
      pull-requests: read
    uses: AlexanderRichert-NOAA/ci-validate-pr/.github/workflows/validate-pr.yaml@0d1dd686cae57ed1f3f37b1028698934af44f22e
    with:
      validate-genai-disclosure: true
