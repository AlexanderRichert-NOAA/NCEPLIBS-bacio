name: Validate PR

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested, edited]
  pull_request_review:
    types: [submitted]

jobs:
  Checks:
    permissions:
      pull-requests: read
    uses: AlexanderRichert-NOAA/ci-validate-pr/.github/workflows/validate-pr.yaml@b1e4839771ce580d4c76961fdbd639005c2d87b8
    with:
      validate-genai-disclosure: true
      approvals-for-critical-changes: 2
      critical-files: |
        CMakeLists.txt
        otherthing
